name: Compilar Instalador Mac

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macOS:
    runs-on: macos-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Convertir icono a .icns (Opcional)
      run: |
        if [ -f rutas_icono.ico ]; then
          python -c "from PIL import Image; import os; img = Image.open('rutas_icono.ico'); os.makedirs('icon.iconset', exist_ok=True); [img.resize((s, s)).save(f'icon.iconset/icon_{s}x{s}.png') for s in [16, 32, 128, 256, 512]]; [img.resize((s*2, s*2)).save(f'icon.iconset/icon_{s}x{s}@2x.png') for s in [16, 32, 128, 256, 512]]"
          iconutil -c icns icon.iconset -o rutas_icono.icns || true
        fi

    - name: Compilar App con PyInstaller
      run: |
        ICON_OPTION=""
        if [ -f rutas_icono.icns ]; then
          ICON_OPTION="--icon=rutas_icono.icns"
        fi

        pyinstaller --noconfirm --onedir --windowed \
          $ICON_OPTION \
          --name="AnalizadorRutas" \
          --add-data "configuracion:configuracion" \
          --add-data "interfaz:interfaz" \
          --add-data "lectores_excel:lectores_excel" \
          --add-data "servicios:servicios" \
          --add-data "visualizaciones:visualizaciones" \
          main.py

    - name: Crear instalador .dmg
      run: |
        brew install create-dmg
        
        CREATE_DMG_ARGS="--volname \"Instalador AnalizadorRutas\" --window-pos 200 120 --window-size 600 400 --icon-size 100 --icon \"AnalizadorRutas.app\" 175 120 --hide-extension \"AnalizadorRutas.app\" --app-drop-link 425 120"
        
        if [ -f rutas_icono.icns ]; then
          CREATE_DMG_ARGS="$CREATE_DMG_ARGS --volicon \"rutas_icono.icns\""
        fi

        eval create-dmg $CREATE_DMG_ARGS "dist/AnalizadorRutas-Mac.dmg" "dist/AnalizadorRutas.app"

    - name: Subir el instalador generado
      uses: actions/upload-artifact@v4
      with:
        name: AnalizadorRutas-Mac
        path: dist/AnalizadorRutas-Mac.dmg