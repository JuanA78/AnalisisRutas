name: Compilar Instalador Mac

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macOS:
    runs-on: macos-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Descargar e instalar Python Universal2 (Intel + ARM)
      run: |
        # Descargamos e instalamos el paquete oficial de Python.org que contiene binarios x86_64 nativos
        curl -O https://www.python.org/ftp/python/3.11.8/python-3.11.8-macos11.pkg
        sudo installer -pkg python-3.11.8-macos11.pkg -target /

    - name: Instalar dependencias para Intel (x86_64)
      run: |
        # Forzamos la ejecucion bajo la arquitectura x86_64
        arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m pip install --upgrade pip
        arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m pip install pyinstaller pillow
        if [ -f requirements.txt ]; then 
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m pip install -r requirements.txt
        fi

    - name: Convertir icono a .icns (Opcional)
      run: |
        if [ -f rutas_icono.ico ]; then
          mkdir -p icon.iconset
          sips -s format png rutas_icono.ico --out icon.iconset/icon_128x128.png || true
          sips -z 16 16     icon.iconset/icon_128x128.png --out icon.iconset/icon_16x16.png || true
          sips -z 32 32     icon.iconset/icon_128x128.png --out icon.iconset/icon_16x16@2x.png || true
          sips -z 32 32     icon.iconset/icon_128x128.png --out icon.iconset/icon_32x32.png || true
          sips -z 64 64     icon.iconset/icon_128x128.png --out icon.iconset/icon_32x32@2x.png || true
          sips -z 256 256   icon.iconset/icon_128x128.png --out icon.iconset/icon_128x128@2x.png || true
          sips -z 256 256   icon.iconset/icon_128x128.png --out icon.iconset/icon_256x256.png || true
          sips -z 512 512   icon.iconset/icon_128x128.png --out icon.iconset/icon_256x256@2x.png || true
          
          iconutil -c icns icon.iconset -o rutas_icono.icns || true
        fi

    - name: Compilar App con PyInstaller para Intel
      run: |
        ICON_OPTION=""
        if [ -f rutas_icono.icns ]; then
          ICON_OPTION="--icon=rutas_icono.icns"
        fi

        # Ejecutamos PyInstaller forzado bajo x86_64 con el Python oficial Universal2
        arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m PyInstaller --noconfirm --onedir --windowed \
          $ICON_OPTION \
          --target-architecture x86_64 \
          --name="AnalizadorRutas" \
          --add-data "configuracion:configuracion" \
          --add-data "interfaz:interfaz" \
          --add-data "lectores_excel:lectores_excel" \
          --add-data "servicios:servicios" \
          --add-data "visualizaciones:visualizaciones" \
          main.py

    - name: Crear instalador .dmg
      run: |
        brew install create-dmg
        
        CREATE_DMG_ARGS="--volname \"Instalador AnalizadorRutas\" --window-pos 200 120 --window-size 600 400 --icon-size 100 --icon \"AnalizadorRutas.app\" 175 120 --hide-extension \"AnalizadorRutas.app\" --app-drop-link 425 120"
        
        if [ -f rutas_icono.icns ]; then
          CREATE_DMG_ARGS="$CREATE_DMG_ARGS --volicon \"rutas_icono.icns\""
        fi

        eval create-dmg $CREATE_DMG_ARGS "dist/AnalizadorRutas-Mac.dmg" "dist/AnalizadorRutas.app"

    - name: Subir el instalador generado
      uses: actions/upload-artifact@v4
      with:
        name: AnalizadorRutas-Mac
        path: dist/AnalizadorRutas-Mac.dmg