name: Compilar Instalador Mac

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macOS:
    runs-on: macos-13

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Convertir icono a .icns (Opcional)
      run: |
        mkdir -p icon.iconset
        sips -z 16 16     rutas_icono.ico --out icon.iconset/icon_16x16.png || true
        sips -z 32 32     rutas_icono.ico --out icon.iconset/icon_16x16@2x.png || true
        sips -z 128 128   rutas_icono.ico --out icon.iconset/icon_128x128.png || true
        iconutil -c icns icon.iconset -o rutas_icono.icns || true

    - name: Compilar App con PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --icon=rutas_icono.icns \
          --name="AnalizadorRutas" \
          --add-data "configuracion:configuracion" \
          --add-data "interfaz:interfaz" \
          --add-data "lectores_excel:lectores_excel" \
          --add-data "servicios:servicios" \
          --add-data "visualizaciones:visualizaciones" \
          main.py

    - name: Crear instalador .dmg
      run: |
        brew install create-dmg
        create-dmg \
          --volname "Instalador AnalizadorRutas" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "AnalizadorRutas.app" 175 120 \
          --hide-extension "AnalizadorRutas.app" \
          --app-drop-link 425 120 \
          "dist/AnalizadorRutas-Mac.dmg" \
          "dist/AnalizadorRutas.app"

    - name: Subir el instalador generado
      uses: actions/upload-artifact@v4
      with:
        name: AnalizadorRutas-Mac
        path: dist/AnalizadorRutas-Mac.dmg